<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Portfólio | Designer Gráfico</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS (v4.6) -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
  >

  <!-- Font Awesome (ícones redes sociais) -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

  <!-- CSS personalizado -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho / Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#">Meu Portfólio</a>
      <button
        class="navbar-toggler"
        type="button"
        data-toggle="collapse"
        data-target="#menu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link" href="#sobre">Sobre Mim</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#projetos">Projetos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#contato">Contato</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Seção Sobre Mim -->
  <section id="sobre" class="py-5 mt-5">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-4 text-center mb-1">
          <img
            src="https://placehold.co/200"
            alt="Foto de perfil"
            class="img-fluid rounded-circle"
          >
        </div>
        <div class="col-md-8">
          <h2>Sobre Mim</h2>
          <p>
            Sou designer gráfico apaixonado por criar identidades visuais,
            layouts modernos e experiências visuais impactantes.
            Trabalho com branding, design digital e projetos criativos.
          </p>
        </div>
      </div>
    </div>
  </section>

  <!-- Galeria de Projetos -->
  <section id="projetos" class="py-5 bg-light">
    <div class="container">
      <h2 class="text-center mb-4">Projetos</h2>
      <div class="row">
        <div class="col-sm-6 col-md-4 mb-4">
          <img src="https://placehold.co/600x400" class="img-fluid" alt="Projeto 1">
        </div>
        <div class="col-sm-6 col-md-4 mb-4">
          <img src="https://placehold.co/600x400" class="img-fluid" alt="Projeto 2">
        </div>
        <div class="col-sm-6 col-md-4 mb-4">
          <img src="https://placehold.co/600x400" class="img-fluid" alt="Projeto 3">
        </div>
        <div class="col-sm-6 col-md-4 mb-4">
          <img src="https://placehold.co/600x400" class="img-fluid" alt="Projeto 4">
        </div>
        <div class="col-sm-6 col-md-4 mb-4">
          <img src="https://placehold.co/600x400" class="img-fluid" alt="Projeto 5">
        </div>
        <div class="col-sm-6 col-md-4 mb-4">
          <img src="https://placehold.co/600x400" class="img-fluid" alt="Projeto 6">
        </div>
      </div>
    </div>
  </section>

  <!-- Rodapé -->
  <footer id="contato" class="bg-dark text-white py-4">
    <div class="container text-center">
      <p class="mb-2">Conecte-se comigo</p>
      <a href="#" class="text-white mx-2">
        <i class="fab fa-instagram fa-2x"></i>
      </a>
      <a href="#" class="text-white mx-2">
        <i class="fab fa-linkedin fa-2x"></i>
      </a>
      <a href="#" class="text-white mx-2">
        <i class="fab fa-behance fa-2x"></i>
      </a>
      <p class="mt-3 mb-0">&copy; 2026 - Portfólio</p>
    </div>
  </footer>

  <!-- Scripts Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

</body>
</html>
